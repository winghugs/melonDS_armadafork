name: Ubuntu

on:
  push:
    branches:
      - master
      - ci/*
      - drm-leasing
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
#  MELONDS_VERSION_SUFFIX: " RC"

jobs:
  build:
    continue-on-error: true
    strategy:
      matrix:
        arch:
          - runner: ubuntu-22.04
            name: x86_64
          - runner: ubuntu-22.04-arm
            name: aarch64

    name: ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      name: Check out sources
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install --allow-downgrades cmake ninja-build extra-cmake-modules libpcap0.8-dev libsdl2-dev libenet-dev \
          qt6-{base,base-private,multimedia}-dev qt6-wayland libqt6svg6-dev libarchive-dev libzstd-dev libfuse2 libfaad-dev \
          libdrm-dev libgbm-dev libwayland-dev libwayland-bin
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DMELONDS_EMBED_BUILD_INFO=ON
    - name: Build
      run: |
        cmake --build build
        DESTDIR=AppDir cmake --install build
    - uses: actions/upload-artifact@v7
      with:
        name: melonDS-ubuntu-${{ matrix.arch.name }}
        path: AppDir/usr/bin/melonDS
    - name: Fetch AppImage tools
      run: |
        wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch.name }}.AppImage
        wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.arch.name }}.AppImage
        chmod a+x linuxdeploy-*.AppImage
    - name: Build the AppImage
      env:
        EXTRA_PLATFORM_PLUGINS: libqwayland-egl.so;libqwayland-generic.so
        EXTRA_QT_PLUGINS: waylandcompositor
        QMAKE: /usr/lib/qt6/bin/qmake
      run: |
        ./linuxdeploy-${{ matrix.arch.name }}.AppImage --appdir AppDir --plugin qt --output appimage
    - uses: actions/upload-artifact@v7
      with:
        name: melonDS-appimage-${{ matrix.arch.name }}
        path: melonDS*.AppImage
        archive: false
    - name: Publish DRM leasing prerelease
      if: matrix.arch.name == 'aarch64' && github.ref == 'refs/heads/drm-leasing' && github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: drm-leasing
        RELEASE_TITLE: melonDS DRM Leasing (ARM64)
        RELEASE_NOTES: Built from ${{ github.repository }} at ${{ github.sha }}.
      run: |
        if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done
          gh release edit "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --prerelease \
            --latest=false
        else
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA"
        fi
        gh release upload "$RELEASE_TAG" melonDS-aarch64.AppImage
